  <body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Clean Service Worker Lifecycle
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // If in dev or iframe preview, unregister stale workers to ensure fresh bundles
          if (window.location.port === '3000' || window.location.hostname.includes('localhost')) {
            navigator.serviceWorker.getRegistrations().then((registrations) => {
              for (const reg of registrations) {
                reg.unregister();
              }
            });
            caches.keys().then((names) => {
              for (const name of names) {
                if (name !== 'sawaari-v2') caches.delete(name);
              }
            });
          } else {
            navigator.serviceWorker.register('/sw.js').then((reg) => {
              reg.update();
            }).catch((err) => {
              console.log('SW registration note:', err);
            });
          }
        });
      }
    </script>
  </body>
